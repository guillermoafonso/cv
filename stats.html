<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counting Game Stats</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stat-card .value {
            font-size: 2em;
            font-weight: bold;
            color: #3498db;
        }
        .stat-card .label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .chart-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
        }
        .chart {
            display: flex;
            align-items: flex-end;
            height: 200px;
            gap: 4px;
            padding: 10px 0;
            border-bottom: 2px solid #ddd;
        }
        .bar-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 20px;
        }
        .bar {
            width: 100%;
            max-width: 25px;
            border-radius: 3px 3px 0 0;
            transition: height 0.3s;
        }
        .bar.accuracy {
            background: linear-gradient(to top, #27ae60, #2ecc71);
        }
        .bar.speed {
            background: linear-gradient(to top, #2980b9, #3498db);
        }
        .bar-label {
            font-size: 0.65em;
            color: #888;
            margin-top: 5px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            max-height: 60px;
            overflow: hidden;
        }
        .bar-value {
            font-size: 0.7em;
            color: #333;
            margin-bottom: 3px;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.85em;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-color {
            width: 15px;
            height: 15px;
            border-radius: 3px;
        }
        .input-section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 150px;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            resize: vertical;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
        }
        button:hover {
            background: #2980b9;
        }
        .hidden {
            display: none;
        }
        .axis-label {
            font-size: 0.75em;
            color: #888;
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
        }
        .trend {
            font-size: 0.9em;
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            background: #f8f9fa;
        }
        .trend.positive {
            color: #27ae60;
        }
        .trend.negative {
            color: #e74c3c;
        }
        .trend.neutral {
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <h1>Counting Game Statistics</h1>

    <div class="input-section">
        <p><strong>Paste your stats.json content below:</strong></p>
        <textarea id="jsonInput" placeholder='{"total_sessions": 0, "sessions": [...] }'></textarea>
        <br>
        <button onclick="loadStats()">Load Statistics</button>
    </div>

    <div id="results" class="hidden">
        <div class="summary" id="summary"></div>

        <div class="chart-container">
            <div class="chart-title">Accuracy Over Time (%)</div>
            <div class="chart" id="accuracyChart"></div>
            <div class="axis-label">
                <span>Older sessions</span>
                <span>Recent sessions</span>
            </div>
            <div id="accuracyTrend" class="trend"></div>
        </div>

        <div class="chart-container">
            <div class="chart-title">Speed Over Time (seconds per symbol - lower is faster)</div>
            <div class="chart" id="speedChart"></div>
            <div class="axis-label">
                <span>Older sessions</span>
                <span>Recent sessions</span>
            </div>
            <div id="speedTrend" class="trend"></div>
        </div>

        <div class="chart-container">
            <div class="chart-title">Accuracy by Count (which numbers are hardest?)</div>
            <div class="chart" id="countChart"></div>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #2ecc71;"></div>
                    <span>Accuracy %</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function loadStats() {
            const input = document.getElementById('jsonInput').value.trim();
            if (!input) {
                alert('Please paste your stats.json content');
                return;
            }

            let data;
            try {
                data = JSON.parse(input);
            } catch (e) {
                alert('Invalid JSON: ' + e.message);
                return;
            }

            if (!data.sessions || !Array.isArray(data.sessions)) {
                alert('Invalid stats format: missing sessions array');
                return;
            }

            document.getElementById('results').classList.remove('hidden');
            renderStats(data);
        }

        function renderStats(data) {
            const sessions = data.sessions.filter(s => s.rounds && s.rounds.length > 0);

            // Calculate per-session metrics
            const sessionMetrics = sessions.map((session, idx) => {
                const rounds = session.rounds;
                const correct = rounds.filter(r => r.was_correct).length;
                const total = rounds.length;
                const accuracy = total > 0 ? (correct / total) * 100 : 0;

                // Calculate speed (time between rounds, normalized by symbol count)
                let totalNormalizedTime = 0;
                let speedSamples = 0;

                for (let i = 1; i < rounds.length; i++) {
                    const prevTime = new Date(rounds[i-1].timestamp);
                    const currTime = new Date(rounds[i].timestamp);
                    const diffSeconds = (currTime - prevTime) / 1000;

                    // Only count reasonable times (between 1 and 60 seconds)
                    // This filters out pauses/breaks
                    if (diffSeconds >= 1 && diffSeconds <= 60) {
                        const symbolCount = rounds[i].correct_answer;
                        totalNormalizedTime += diffSeconds / symbolCount;
                        speedSamples++;
                    }
                }

                const avgNormalizedSpeed = speedSamples > 0 ? totalNormalizedTime / speedSamples : null;

                // Get session date
                const date = new Date(session.start_time);
                const dateStr = date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

                return {
                    date: dateStr,
                    accuracy: accuracy,
                    speed: avgNormalizedSpeed,
                    correct: correct,
                    total: total
                };
            });

            // Summary stats
            const totalCorrect = data.total_correct || sessionMetrics.reduce((a, s) => a + s.correct, 0);
            const totalRounds = data.total_rounds || sessionMetrics.reduce((a, s) => a + s.total, 0);
            const overallAccuracy = totalRounds > 0 ? (totalCorrect / totalRounds * 100).toFixed(1) : 0;
            const validSpeedSessions = sessionMetrics.filter(s => s.speed !== null);
            const avgSpeed = validSpeedSessions.length > 0
                ? (validSpeedSessions.reduce((a, s) => a + s.speed, 0) / validSpeedSessions.length).toFixed(2)
                : 'N/A';

            document.getElementById('summary').innerHTML = `
                <div class="stat-card">
                    <div class="value">${sessions.length}</div>
                    <div class="label">Sessions Played</div>
                </div>
                <div class="stat-card">
                    <div class="value">${totalRounds}</div>
                    <div class="label">Total Rounds</div>
                </div>
                <div class="stat-card">
                    <div class="value">${overallAccuracy}%</div>
                    <div class="label">Overall Accuracy</div>
                </div>
                <div class="stat-card">
                    <div class="value">${avgSpeed}s</div>
                    <div class="label">Avg Speed/Symbol</div>
                </div>
            `;

            // Accuracy chart
            renderBarChart('accuracyChart', sessionMetrics, 'accuracy', 100, '%', '#2ecc71');
            renderTrend('accuracyTrend', sessionMetrics.map(s => s.accuracy), 'accuracy', true);

            // Speed chart (invert so lower is better visually shown correctly)
            const speedData = sessionMetrics.filter(s => s.speed !== null);
            renderBarChart('speedChart', speedData, 'speed', 5, 's', '#3498db');
            renderTrend('speedTrend', speedData.map(s => s.speed), 'speed', false);

            // Accuracy by count
            renderAccuracyByCount(data);
        }

        function renderBarChart(containerId, data, field, maxVal, unit, color) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            // Auto-scale max value
            const values = data.map(d => d[field]).filter(v => v !== null);
            const dataMax = Math.max(...values);
            const scale = Math.min(maxVal, dataMax * 1.2);

            data.forEach(item => {
                const value = item[field];
                if (value === null) return;

                const height = Math.max(5, (value / scale) * 100);
                const displayVal = value.toFixed(field === 'accuracy' ? 0 : 1);

                const group = document.createElement('div');
                group.className = 'bar-group';
                group.innerHTML = `
                    <div class="bar-value">${displayVal}${unit}</div>
                    <div class="bar ${field}" style="height: ${height}%; background: ${color};"></div>
                    <div class="bar-label">${item.date}</div>
                `;
                container.appendChild(group);
            });
        }

        function renderTrend(containerId, values, type, higherIsBetter) {
            const container = document.getElementById(containerId);
            if (values.length < 4) {
                container.innerHTML = 'Not enough data for trend analysis';
                container.className = 'trend neutral';
                return;
            }

            // Compare first half average to second half average
            const mid = Math.floor(values.length / 2);
            const firstHalf = values.slice(0, mid);
            const secondHalf = values.slice(mid);

            const firstAvg = firstHalf.reduce((a, b) => a + b, 0) / firstHalf.length;
            const secondAvg = secondHalf.reduce((a, b) => a + b, 0) / secondHalf.length;

            const change = secondAvg - firstAvg;
            const percentChange = ((change / firstAvg) * 100).toFixed(1);

            let improving, message;
            if (type === 'accuracy') {
                improving = change > 1;
                const direction = change > 1 ? 'improved' : change < -1 ? 'decreased' : 'stayed stable';
                message = `Accuracy ${direction} by ${Math.abs(percentChange)}% (${firstAvg.toFixed(1)}% -> ${secondAvg.toFixed(1)}%)`;
            } else {
                improving = change < -0.1;
                const direction = change < -0.1 ? 'improved (faster)' : change > 0.1 ? 'slowed down' : 'stayed stable';
                message = `Speed ${direction}: ${firstAvg.toFixed(2)}s -> ${secondAvg.toFixed(2)}s per symbol`;
            }

            container.textContent = message;
            container.className = 'trend ' + (improving ? 'positive' : (Math.abs(change) < 0.1 ? 'neutral' : 'negative'));
        }

        function renderAccuracyByCount(data) {
            const container = document.getElementById('countChart');
            container.innerHTML = '';

            // Group all rounds by correct_answer count
            const byCount = {};
            data.sessions.forEach(session => {
                session.rounds.forEach(round => {
                    const count = round.correct_answer;
                    if (!byCount[count]) {
                        byCount[count] = { correct: 0, total: 0 };
                    }
                    byCount[count].total++;
                    if (round.was_correct) {
                        byCount[count].correct++;
                    }
                });
            });

            // Sort by count and render
            const counts = Object.keys(byCount).map(Number).sort((a, b) => a - b);

            counts.forEach(count => {
                const stats = byCount[count];
                const accuracy = (stats.correct / stats.total) * 100;
                const height = Math.max(5, accuracy);

                const group = document.createElement('div');
                group.className = 'bar-group';
                group.innerHTML = `
                    <div class="bar-value">${accuracy.toFixed(0)}%</div>
                    <div class="bar accuracy" style="height: ${height}%;"></div>
                    <div class="bar-label" style="writing-mode: horizontal-tb; transform: none;">${count}</div>
                `;
                container.appendChild(group);
            });
        }
    </script>
</body>
</html>
